# Local HTTP only: ./scripts/up.sh --local --example
services:
  app:
    ports: !reset []
    networks:
      storage: {}
      application: {}
      example_ingress:
        aliases: [trust-backend]
    environment:
      KRINE_TRUSTED_PROXIES: ${KRINE_EXAMPLE_NETWORK_PREFIX:-10.203.80}.2/32
  example:
    image: ${KRINE_EXAMPLE_IMAGE:-krine-protected-app:local}
    build:
      context: .
      dockerfile: examples/protected-app/Dockerfile
    restart: unless-stopped
    networks: [example_ingress]
    environment:
      DEMO_HOST: 0.0.0.0
      DEMO_PORT: 3000
      DEMO_DATA_DIR: /var/lib/draftroom
      DEMO_ORIGIN: http://localhost:${KRINE_EXAMPLE_PORT:-3000}
      DEMO_DEVELOPMENT: "true"
      DEMO_TRUSTED_PROXIES: ${KRINE_EXAMPLE_NETWORK_PREFIX:-10.203.80}.2/32
      KRINE_URL: http://trust-backend:8080
      KRINE_BROWSER_URL: ${KRINE_PUBLIC_URL:?Set KRINE_PUBLIC_URL}
      KRINE_FALLBACK: ${KRINE_EXAMPLE_FALLBACK:-ALLOW}
    secrets:
      - source: example_browser_public_key
        target: browser_public_key
      - source: example_server_secret
        target: server_secret
    volumes: [example_data:/var/lib/draftroom]
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 35s
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  example-ingress:
    image: ${KRINE_EXAMPLE_INGRESS_IMAGE:-krine-example-ingress:local}
    build:
      context: .
      dockerfile: deploy/example/Dockerfile
    restart: unless-stopped
    user: 101:101
    networks:
      application: {}
      example_ingress:
        ipv4_address: ${KRINE_EXAMPLE_NETWORK_PREFIX:-10.203.80}.2
    ports:
      - "127.0.0.1:${KRINE_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${KRINE_EXAMPLE_PORT:-3000}:3000"
    depends_on:
      app:
        condition: service_healthy
      example:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    mem_limit: 64m
    pids_limit: 32
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  example_ingress:
    internal: true
    ipam:
      config:
        - subnet: ${KRINE_EXAMPLE_NETWORK_PREFIX:-10.203.80}.0/24
          ip_range: ${KRINE_EXAMPLE_NETWORK_PREFIX:-10.203.80}.128/25
volumes:
  example_data:
secrets:
  example_browser_public_key:
    file: ${KRINE_EXAMPLE_PUBLIC_KEY_FILE:-${KRINE_SECRETS_DIR:-./deploy/secrets}/browser_public_key}
  example_server_secret:
    file: ${KRINE_EXAMPLE_SERVER_SECRET_FILE:-${KRINE_SECRETS_DIR:-./deploy/secrets}/server_secret}
