name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: krine-ci
      KRINE_SECRETS_DIR: /tmp/krine-ci-secrets
      KRINE_PUBLIC_URL: http://127.0.0.1:8080
      KRINE_ALLOWED_ORIGINS: http://localhost:3000
      KRINE_DEVELOPMENT: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 11.28.2
      - name: Install Rust toolchain and JavaScript dependencies
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          pnpm install --frozen-lockfile
      - name: Formatting and static checks
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          pnpm build
          pnpm typecheck
      - name: Unit and frontend tests
        run: |
          cargo test --workspace --locked
          pnpm test
          python3 scripts/check-example-isolation.py
          python3 scripts/check-recovery-isolation.py
          python3 -B -m unittest discover -s scripts/demo -p 'test_*.py'
          python3 -B -m unittest discover -s scripts/operator_auth_tests -p 'test_*.py'
      - name: Dependency advisories
        run: |
          pnpm audit --prod
          cargo install cargo-audit --version 0.22.2 --locked
          python3 scripts/audit-rust.py
      - name: ClickHouse diagnostic upgrade and isolation
        run: python3 scripts/check-clickhouse-diagnostics.py
      - name: Start real stores
        run: ./scripts/dev-up.sh
      - name: Outside-in and recovery tests
        run: |
          python3 scripts/check-test-isolation.py
          ./scripts/with-dev-env.py --isolated-stores cargo test -p krine-server --locked -- --ignored --test-threads=1
      - name: Build and exercise complete image
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml down
          docker compose -f compose.yaml -f compose.app.yaml build app
          python3 scripts/check-app-secrets.py
          docker compose -f compose.yaml -f compose.app.yaml up -d --wait --wait-timeout 180
          python3 scripts/smoke-app.py http://127.0.0.1:8080
          docker compose -f compose.yaml -f compose.app.yaml restart app
          docker compose -f compose.yaml -f compose.app.yaml up -d --wait --wait-timeout 180
          python3 scripts/smoke-app.py http://127.0.0.1:8080 --after-restart
      - name: Build and exercise protected application ingress
        run: |
          docker compose -f compose.yaml -f compose.app.yaml down
          docker compose --env-file deploy/example/local.env.example -f compose.yaml -f compose.app.yaml -f compose.example.yaml build example example-ingress
          docker compose --env-file deploy/example/local.env.example -f compose.yaml -f compose.app.yaml -f compose.example.yaml up -d --wait --wait-timeout 180
          python3 scripts/check-example-secrets.py
          python3 scripts/smoke-example.py --provision-test-policy
      - name: Rehearse stopped-boundary disaster recovery
        run: |
          docker compose --env-file deploy/example/local.env.example -f compose.yaml -f compose.app.yaml -f compose.example.yaml down
          python3 scripts/verify-recovery.py --image krine:local --example-image krine-protected-app:local --ingress-image krine-example-ingress:local
      - name: Representative demo import and recovery
        run: python3 -B scripts/verify-demo.py --image krine:local
      - name: Dependency status on failure
        if: failure()
        run: |
          docker compose --env-file deploy/example/local.env.example -f compose.yaml -f compose.app.yaml -f compose.example.yaml ps -a
          docker compose --env-file deploy/example/local.env.example -f compose.yaml -f compose.app.yaml -f compose.example.yaml logs --no-color --tail=100
          docker compose -f compose.yaml -f compose.app.yaml ps -a -q app | xargs -r docker inspect --format '{{json .State}}'
      - name: Clean disposable stores
        if: always()
        run: docker compose --env-file deploy/example/local.env.example -f compose.yaml -f compose.app.yaml -f compose.dev.yaml -f compose.example.yaml down --volumes --remove-orphans
