worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    # No query strings, cookies, credentials, or request bodies in access logs.
    log_format ingress '$remote_addr [$time_local] "$request_method $uri" $status';
    access_log /dev/stdout ingress;
    server_tokens off;
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream krine_backend {
        zone krine_backend 64k;
        server trust-backend:8080 resolve;
    }
    upstream trial_backend {
        zone trial_backend 64k;
        server example:3000 resolve;
    }
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    # This local ingress is the first trusted hop. Never append incoming XFF.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header Forwarded "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_next_upstream off;
    proxy_buffering off;
    server {
        listen 8080;
        location / { proxy_pass http://krine_backend; }
    }
    server {
        listen 3000;
        location / { proxy_pass http://trial_backend; }
    }
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /health { return 200 'ready\n'; }
        location / { return 404; }
    }
}
